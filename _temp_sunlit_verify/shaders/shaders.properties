# Sunlit — HLSL 光影包（实验性）
# 元数据（Iris 风格）
name=Sunlit Realistic
author=xgdt
version=0.2.0
description=写实柔和调色 / 圆形太阳 / 体积云 / 夜空星点 / 海蓝水波纹 / 末地银河 / 屏幕空间地形光照

# 设置项声明顺序决定 uniform Options[] 的排列，第 n 个 = Options[n/4][n%4]
# 修复：云层波动粼粼问题（2026-10-25）

option.BRIGHTNESS=1.0
option.BRIGHTNESS.min=0.6
option.BRIGHTNESS.max=1.6
option.BRIGHTNESS.comment=整体亮度

option.SATURATION=1.0
option.SATURATION.min=0.0
option.SATURATION.max=2.0
option.SATURATION.comment=色彩饱和度

option.CONTRAST=0.4
option.CONTRAST.min=0.0
option.CONTRAST.max=1.0
option.CONTRAST.comment=对比度（柔和 S 曲线强度）

option.VIGNETTE=0.18
option.VIGNETTE.min=0.0
option.VIGNETTE.max=1.0
option.VIGNETTE.comment=暗角强度

option.CLOUD_COVERAGE=0.30
option.CLOUD_COVERAGE.min=0.0
option.CLOUD_COVERAGE.max=1.0
option.CLOUD_COVERAGE.comment=云量（越大云越厚）

option.CLOUD_SPEED=1.0
option.CLOUD_SPEED.min=0.0
option.CLOUD_SPEED.max=3.0
option.CLOUD_SPEED.comment=云移动速度

option.STAR_BRIGHTNESS=2.2
option.STAR_BRIGHTNESS.min=0.0
option.STAR_BRIGHTNESS.max=4.0
option.STAR_BRIGHTNESS.comment=夜空星点亮度

option.SUN_SIZE=1.0
option.SUN_SIZE.min=0.5
option.SUN_SIZE.max=2.5
option.SUN_SIZE.comment=太阳圆盘大小

option.SUN_INTENSITY=1.6
option.SUN_INTENSITY.min=0.0
option.SUN_INTENSITY.max=4.0
option.SUN_INTENSITY.comment=太阳亮度

option.HAZE=0.35
option.HAZE.min=0.0
option.HAZE.max=1.0
option.HAZE.comment=雾霭强度（地平线雾霭 + 大气距离雾）

option.EXPOSURE=1.05
option.EXPOSURE.min=0.5
option.EXPOSURE.max=2.0
option.EXPOSURE.comment=曝光

option.WARMTH=0.35
option.WARMTH.min=0.0
option.WARMTH.max=1.0
option.WARMTH.comment=暖色偏移

option.SHADOW_LIFT=0.015
option.SHADOW_LIFT.min=0.0
option.SHADOW_LIFT.max=0.12
option.SHADOW_LIFT.comment=暗部抬升（防止黑黢黢）

option.NIGHT_LIFT=0.02
option.NIGHT_LIFT.min=0.0
option.NIGHT_LIFT.max=0.12
option.NIGHT_LIFT.comment=夜间抬升

option.SHARPEN=0.12
option.SHARPEN.min=0.0
option.SHARPEN.max=1.0
option.SHARPEN.comment=轻度锐化

option.CLOUD_STEPS=20
option.CLOUD_STEPS.min=6
option.CLOUD_STEPS.max=48
option.CLOUD_STEPS.comment=体积云步数（越高越细腻，越吃性能）

option.WATER_TINT=0.85
option.WATER_TINT.min=0.0
option.WATER_TINT.max=1.0
option.WATER_TINT.comment=水面海蓝色调（0 = 关闭）

option.WATER_RIPPLES=0.75
option.WATER_RIPPLES.min=0.0
option.WATER_RIPPLES.max=1.0
option.WATER_RIPPLES.comment=水波纹强度（0 = 关闭）

option.WATER_GLINT=0.60
option.WATER_GLINT.min=0.0
option.WATER_GLINT.max=1.0
option.WATER_GLINT.comment=水面阳光反光

option.END_GALAXY=0.9
option.END_GALAXY.min=0.0
option.END_GALAXY.max=2.0
option.END_GALAXY.comment=末地银河亮度（0 = 关闭）

option.CLOUD_SIZE=0.33
option.CLOUD_SIZE.min=0.20
option.CLOUD_SIZE.max=1.0
option.CLOUD_SIZE.comment=云块大小（1.0 = 原来的大云板，越小云块越碎、移动视差越明显）

option.CLOUD_AMOUNT=0.60
option.CLOUD_AMOUNT.min=0.0
option.CLOUD_AMOUNT.max=1.0
option.CLOUD_AMOUNT.comment=云层密度/厚度

option.CLOUD_RAIN=0.0
option.CLOUD_RAIN.min=0.0
option.CLOUD_RAIN.max=1.0
option.CLOUD_RAIN.comment=雨云程度（1=厚重雨云）

option.CLOUD_HEIGHT=8.0
option.CLOUD_HEIGHT.min=2.0
option.CLOUD_HEIGHT.max=20.0
option.CLOUD_HEIGHT.comment=云层底部高度（格，8=默认800格）

option.CLOUD_THICK=9.0
option.CLOUD_THICK.min=2.0
option.CLOUD_THICK.max=30.0
option.CLOUD_THICK.comment=云层厚度（格×1000，9=默认9000格）

option.CLOUD_CENTER=0.20
option.CLOUD_CENTER.min=0.05
option.CLOUD_CENTER.max=0.80
option.CLOUD_CENTER.comment=云团中心集中度（越小云越集中在中心区域）

option.CLOUD_HARD=0.20
option.CLOUD_HARD.min=0.05
option.CLOUD_HARD.max=1.0
option.CLOUD_HARD.comment=云边硬度（越大云团轮廓越清晰）

option.CLOUD_OCT=4
option.CLOUD_OCT.min=1
option.CLOUD_OCT.max=6
option.CLOUD_OCT.comment=云密度噪声 octave 数（越大云越细节）

option.TERRAIN_LIGHT=0.0
option.TERRAIN_LIGHT.min=0.0
option.TERRAIN_LIGHT.max=1.0
option.TERRAIN_LIGHT.comment=屏幕空间地形光照（兰伯特漫反射，与光追阴影兼容；0=关）
