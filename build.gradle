plugins {
    id 'java'
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // 添加 Fabric Loader 作为编译依赖（从本地 Maven 或直接下载）
    compileOnly 'net.fabricmc:fabric-loader:0.16.9'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    manifest {
        attributes(
            'MixinConfigs': 'mixins.gl4dx12.json',
            'Fabric-Loom-Version': '0',
            'Manifest-Version': '1.0'
        )
    }
    from {
        // 不包含依赖，保持简单
    }
    archiveFileName = 'gl4dx12-1.0.0.jar'
}