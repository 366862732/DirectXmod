name=Foxy DX12
author=port of BlyTheFox's Foxy Shader
version=1.0.0
description=Foxy Shader ported to gl4dx12: cinematic sky / ACES tone / bloom / volumetric clouds / sun disk / stars / moon / aerial fog / night vision / shadow PCF / water tint / rain

# === Option index map (declaration order = uniform order, n -> Options[n/4][n%4]) ===
# Format: max 24 options; declaration order MUST match the O_* macros below.
# [0] BRIGHTNESS, SATURATION, CONTRAST, VIGNETTE
# [1] EXPOSURE, TONEMAPPER, AGX_LOOK, BLOOM_STRENGTH
# [2] SUN_INTENSITY, MOON_INTENSITY, NIGHT_BRIGHTNESS, PURKINJE
# [3] CLOUD_COVERAGE, CLOUD_SPEED, CLOUD_STEPS, CLOUD_SIZE
# [4] CLOUD_HEIGHT, CLOUD_THICK, CLOUD_DENSITY, HAZE
# [5] WARMTH, SHADOW_LIFT, WATER_TINT, RAIN

option.BRIGHTNESS=1.0
option.BRIGHTNESS.min=0.4
option.BRIGHTNESS.max=2.0
option.BRIGHTNESS.comment=整体亮度

option.SATURATION=1.0
option.SATURATION.min=0.0
option.SATURATION.max=2.0
option.SATURATION.comment=饱和度

option.CONTRAST=0.50
option.CONTRAST.min=0.0
option.CONTRAST.max=1.0
option.CONTRAST.comment=对比度（柔和 S 曲线）

option.VIGNETTE=0.22
option.VIGNETTE.min=0.0
option.VIGNETTE.max=1.0
option.VIGNETTE.comment=暗角

option.EXPOSURE=1.15
option.EXPOSURE.min=0.4
option.EXPOSURE.max=3.0
option.EXPOSURE.comment=曝光

option.TONEMAPPER=0
option.TONEMAPPER.min=0
option.TONEMAPPER.max=6
option.TONEMAPPER.comment=色调映射（0=None / 1=ACES / 2=AGX / 3=Filmic / 4=Reinhard / 5=ACES2 / 6=Hable）

option.AGX_LOOK=0
option.AGX_LOOK.min=0
option.AGX_LOOK.max=4
option.AGX_LOOK.comment=AGX look（0-4，4 最电影）

option.BLOOM_STRENGTH=30
option.BLOOM_STRENGTH.min=0
option.BLOOM_STRENGTH.max=80
option.BLOOM_STRENGTH.comment=泛光强度

option.SUN_INTENSITY=1.50
option.SUN_INTENSITY.min=0.0
option.SUN_INTENSITY.max=5.0
option.SUN_INTENSITY.comment=太阳亮度

option.MOON_INTENSITY=0.4
option.MOON_INTENSITY.min=0.0
option.MOON_INTENSITY.max=1.5
option.MOON_INTENSITY.comment=月亮亮度

option.NIGHT_BRIGHTNESS=0.22
option.NIGHT_BRIGHTNESS.min=0.0
option.NIGHT_BRIGHTNESS.max=1.0
option.NIGHT_BRIGHTNESS.comment=夜间基础亮度

option.PURKINJE=0.35
option.PURKINJE.min=0.0
option.PURKINJE.max=1.0
option.PURKINJE.comment=浦肯野（夜间偏蓝）

option.CLOUD_COVERAGE=0.55
option.CLOUD_COVERAGE.min=0.0
option.CLOUD_COVERAGE.max=1.0
option.CLOUD_COVERAGE.comment=云量

option.CLOUD_SPEED=0.6
