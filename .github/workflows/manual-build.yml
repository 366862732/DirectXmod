name: Manual Build (CMake DLL + Gradle fabric)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'CMake 构建类型'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
          - RelWithDebInfo
      gradle_task:
        description: 'Gradle 构建任务'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - assembleRelease
          - assembleDebug

jobs:
  build-native:
    name: CMake 编译 DLL
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: 设置 JDK (为 JNI 提供头文件)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: 配置 CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} `
                -DCMAKE_CXX_FLAGS="/I $env:JAVA_HOME\include /I $env:JAVA_HOME\include\win32 /wd4996"

      - name: 编译 DLL
        run: cmake --build build --config ${{ inputs.build_type }} --parallel

      - name: 上传 DLL 产物
        uses: actions/upload-artifact@v4
        with:
          name: native-dll-${{ inputs.build_type }}
          path: |
            native/build/**/*.dll
            native/build/**/*.lib
            native/build/**/*.pdb
          if-no-files-found: error

  build-fabric:
    name: Gradle 构建 fabric
    needs: build-native
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fabric
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: 暴力清理残留
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -f .gitmodules
          git rm --cached DLSS voxy -r || true
          
      - name: 全盘搜索并消灭写死的 JDK 路径
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== 搜索被写死的 Java 路径 ==="
          grep -rn "org.gradle.java.home" . || echo "搜索完成，未发现配置"
          
          # 暴力替换所有匹配到的行
          find . -type f -name "*.properties" | while read file; do
            sed -i 's/^org.gradle.java.home/#org.gradle.java.home/g' "$file"
          done

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 下载 DLL 产物
        uses: actions/download-artifact@v4
        with:
          name: native-dll-${{ inputs.build_type }}
          path: fabric/src/main/resources/native

      - name: 执行 Gradle 构建
        # 这里去掉了多余的环境变量，如果文件清理干净了，这行就会正常执行
        run: .\gradlew.bat ${{ inputs.gradle_task }} --no-daemon

      - name: 上传 fabric 产物
        uses: actions/upload-artifact@v4
        with:
          name: fabric-output
          path: |
            fabric/build/libs/*.jar
            fabric/build/outputs/**/*.aar
            fabric/build/outputs/**/*.apk
          if-no-files-found: warn