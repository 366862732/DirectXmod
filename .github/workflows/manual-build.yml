name: Manual Build (CMake DLL + Gradle fabric)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'CMake 构建类型'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
          - RelWithDebInfo
      gradle_task:
        description: 'Gradle 构建任务'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - assembleRelease
          - assembleDebug

jobs:
  build-native:
    name: CMake 编译 DLL
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: false #强制关闭防止DLSS报错
          fetch-depth: 1

      - name: 清理残留的子模块配置
        shell: bash
        run: |
          # 如果 .gitmodules 存在，把它删掉，并清理 git 的缓存记录
          if [ -f .gitmodules ]; then
            rm .gitmodules
            git rm --cached DLSS || true
            git config --file .git/config --remove-section submodule.DLSS || true
          fi
          rm -rf DLSS
          # 如果你本地的 DLSS 文件夹需要保留，建议把里面需要的文件（比如头文件）直接提取到主仓库提交
      - name: 设置 JDK (为 JNI 提供头文件)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: 配置 CMake
        # 传递 JAVA_HOME 的 include 目录给 CMake，并屏蔽 C4996 警告
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} `
                -DCMAKE_CXX_FLAGS="/I $env:JAVA_HOME\include /I $env:JAVA_HOME\include\win32 /wd4996"

      - name: 编译 DLL
        run: cmake --build build --config ${{ inputs.build_type }} --parallel

      - name: 上传 DLL 产物
        uses: actions/upload-artifact@v4
        with:
          name: native-dll-${{ inputs.build_type }}
          path: |
            native/build/**/*.dll
            native/build/**/*.lib
            native/build/**/*.pdb
          if-no-files-found: error

  build-fabric:
    name: Gradle 构建 fabric
    needs: build-native
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fabric
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 下载 DLL 产物
        uses: actions/download-artifact@v4
        with:
          name: native-dll-${{ inputs.build_type }}
          # 注意：这里需要确认你的 Java 代码到底去哪个目录找 DLL
          # 暂时默认放在 resources/native 下
          path: fabric/src/main/resources/native

      - name: 执行 Gradle 构建
        run: .\gradlew.bat ${{ inputs.gradle_task }} --no-daemon

      - name: 上传 fabric 产物
        uses: actions/upload-artifact@v4
        with:
          name: fabric-output
          path: |
            fabric/build/libs/*.jar
            fabric/build/outputs/**/*.aar
            fabric/build/outputs/**/*.apk
          if-no-files-found: warn