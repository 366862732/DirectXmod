name: Manual Build (CMake DLL + Gradle fabric)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'CMake 构建类型'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
          - RelWithDebInfo
      gradle_task:
        description: 'Gradle 构建任务'
        required: true
        default: 'build'
        type: choice
        options:
          - build
          - assembleRelease
          - assembleDebug

jobs:
  build-native:
    name: CMake 编译 DLL
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: 设置 JDK (为 JNI 提供头文件)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: 配置 CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ inputs.build_type }} `
                -DCMAKE_CXX_FLAGS="/I $env:JAVA_HOME\include /I $env:JAVA_HOME\include\win32 /wd4996"

      - name: 编译 DLL
        run: cmake --build build --config ${{ inputs.build_type }} --parallel

      - name: 上传 DLL 产物
        uses: actions/upload-artifact@v4
        with:
          name: native-dll-${{ inputs.build_type }}
          path: |
            native/build/**/*.dll
            native/build/**/*.lib
            native/build/**/*.pdb
          if-no-files-found: error

  build-fabric:
    name: Gradle 构建 fabric
    needs: build-native
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fabric
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: 物理粉碎旧的 Gradle 缓存
        shell: powershell
        run: |
          # 强行删除整个隐藏的 .gradle 文件夹
          if (Test-Path -Path "${{ github.workspace }}\.gradle") { Remove-Item -Recurse -Force "${{ github.workspace }}\.gradle" }
          if (Test-Path -Path "$env:USERPROFILE\.gradle") { Remove-Item -Recurse -Force "$env:USERPROFILE\.gradle" }
          if (Test-Path -Path "${{ github.workspace }}\fabric\.gradle") { Remove-Item -Recurse -Force "${{ github.workspace }}\fabric\.gradle" }

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: 下载 DLL 产物
        uses: actions/download-artifact@v4
        with:
          name: native-dll-${{ inputs.build_type }}
          path: fabric/src/main/resources/native

      - name: 执行 Gradle 构建
        shell: powershell
        run: |
          # 再次确保环境变量正确
          $env:JAVA_HOME = "${{ env.JAVA_HOME }}"
          
          # 创建本地干净配置
          $gradleHome = "D:\gradle_home"
          New-Item -ItemType Directory -Force -Path $gradleHome | Out-Null
          "org.gradle.java.home=$env:JAVA_HOME" | Out-File -FilePath "$gradleHome\gradle.properties" -Encoding utf8
          $env:GRADLE_USER_HOME = $gradleHome
          
          # 停止可能运行的守护进程
          .\gradlew.bat --stop
          
          # 注意这里加了 -x test，跳过在云端没有显卡时毫无意义的图形测试
          .\gradlew.bat ${{ inputs.gradle_task }} -x test --no-daemon

      - name: 上传 fabric 产物
        uses: actions/upload-artifact@v4
        with:
          name: fabric-output
          path: |
            fabric/build/libs/*.jar
            fabric/build/outputs/**/*.aar
            fabric/build/outputs/**/*.apk
          if-no-files-found: warn