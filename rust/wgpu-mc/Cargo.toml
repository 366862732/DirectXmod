[package]
name = "wgpu-mc"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "23"
bytemuck = { version = "1.14", features = ["derive"] }
log = "0.4"
env_logger = "0.10"
futures = "0.3"
raw-window-handle = "0.6"
winit = "0.30"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
