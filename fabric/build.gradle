plugins {
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_name
}

repositories {
    mavenCentral()
}

// Just compile Java code - no Fabric API dependency for now
// The JAR will be manually placed in .minecraft/mods/

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

jar {
    from('src/main/resources') {
        include '*.json'
    }
}
