plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_name
}

repositories {
    // Minecraft 26.2 的 LWJGL 是 Mojang 补丁版（3.4.1-mojang-*），只发布在
    // libraries.minecraft.net，不在 Maven Central；Loom 的自动仓库没有覆盖到
    // 这个传递依赖，必须显式声明，否则干净环境会解析失败。
    maven {
        name = "Minecraft Libraries"
        url = "https://libraries.minecraft.net/"
    }
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Modrinth"
        url = "https://maven.modrinth.com/releases/"
    }
}

// Loom 1.15.5 会注入一个名为 MavenCentralLWJGL 的 exclusive 仓库，把 org.lwjgl
// 整个组锁死在 Maven Central。但 Minecraft 26.2 用的是 Mojang 补丁版 LWJGL
// （3.4.1-mojang-*），只发布在 libraries.minecraft.net，Maven Central 上没有，
// 于是干净环境编译直接失败。把 Loom 注入的这个仓库改指向 Mojang 库即可：
// exclusive 规则保留，org.lwjgl 仍然只走一个仓库。
repositories.configureEach {
    if (name == "MavenCentralLWJGL") {
        url = "https://libraries.minecraft.net/"
    }
}

loom {
    mods {
        register("gl4dx12") {
            sourceSet(sourceSets["main"])
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation files('libs/modmenu-20.0.1.jar')

    // Pure-Java D3D12 backend via JNA
    implementation "net.java.dev.jna:jna:5.17.0"

    testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    // VMProtect 产物只用于本地加壳实验，不进发布 jar（否则体积从 1.4MB 涨到 4MB）。
    exclude 'dx12_mc.vmp.dll'
    exclude 'dx12_mc.dll.vmp'
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Enable native access for JNA on Java 26+
tasks.withType(Test).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    useJUnitPlatform()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}
